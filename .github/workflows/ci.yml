name: CI

# Runs on every push to master and every pull request.
# Everything here must be free and deterministic: no secret keys, no live
# arXiv/Groq/Gemini calls, no database. The three verifiers stub fetch, and
# `next build` is expected to succeed with *no* environment variables at all —
# that is itself a guarantee we want to keep (see decision D38).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + offline verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Deliberately empty: CI has no .env.local, and the build must cope.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Cache Components validates routes during `next build`, so a component
      # that reads the clock or a cookie without `connection()` fails here
      # rather than in production logs (BUG-014, BUG-015).
      - name: Build (no env vars)
        run: npm run build

      - name: Offline verifiers
        run: npm run verify:offline
